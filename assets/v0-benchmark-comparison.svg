<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" fill="none" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="v0Purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="v0CardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Header Banner -->
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Automated Benchmark: v0 Analytics Dashboard Repair</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#94a3b8">Side-by-side evaluation of raw generative AI output vs. Sloppy AST-repaired craft</text>

  <!-- LEFT: BEFORE (v0 Raw Slop) -->
  <g transform="translate(30, 85)">
    <!-- Container -->
    <rect width="455" height="400" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <!-- Status Badge -->
    <rect x="20" y="16" width="160" height="26" rx="6" fill="#450a0a" stroke="#b91c1c" stroke-width="1" />
    <text x="30" y="33" font-size="11" font-weight="700" fill="#f87171">BEFORE: GRADE F (88/100)</text>

    <!-- Headline with Purple Slop Gradient -->
    <text x="20" y="75" font-size="22" font-weight="800" fill="url(#v0Purple)">Unlock Next-Gen AI Analytics</text>
    <text x="20" y="98" font-size="12" fill="#818cf8">Not just data — it is your hyper-intelligent workflow.</text>

    <!-- Unanchored Floating Box (Air on 4 sides) -->
    <g transform="translate(30, 115)">
      <rect width="395" height="180" rx="16" fill="url(#v0CardGrad)" stroke="#a855f7" stroke-width="2" />
      
      <!-- Sparkle Button Slop -->
      <rect x="20" y="20" width="130" height="32" rx="8" fill="#7c3aed" />
      <path d="M 32 36 L 35 30 L 38 36 L 44 39 L 38 42 L 35 48 L 32 42 L 26 39 Z" fill="#fde047" />
      <text x="48" y="41" font-size="12" font-weight="600" fill="#ffffff">Ask AI Magic</text>

      <!-- Low Contrast Muted Text -->
      <text x="20" y="80" font-size="11" fill="#64748b">10,000+ active enterprise teams trust our 99.99% uptime platform.</text>
      
      <!-- Boxed Cards Monotony inside Card -->
      <rect x="20" y="100" width="110" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="30" y="125" font-size="10" fill="#94a3b8">Total Revenue</text>
      <text x="30" y="145" font-size="15" font-weight="700" fill="#ffffff">$128,430</text>

      <rect x="142" y="100" width="110" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="152" y="125" font-size="10" fill="#94a3b8">AI Actions</text>
      <text x="152" y="145" font-size="15" font-weight="700" fill="#ffffff">89,120</text>

      <rect x="264" y="100" width="110" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="274" y="125" font-size="10" fill="#94a3b8">Growth</text>
      <text x="274" y="145" font-size="15" font-weight="700" fill="#ffffff">+42.8%</text>
    </g>

    <!-- Detected Violations List -->
    <rect x="20" y="315" width="415" height="70" rx="8" fill="#18181b" stroke="#27272a" />
    <text x="30" y="333" font-size="11" font-weight="700" fill="#fca5a5">Detected Anti-Patterns (AST Gate Failed):</text>
    <text x="30" y="350" font-size="10" fill="#f87171">• VIS-01: Hero gradient text (purple/indigo/cyan bg-clip-text)</text>
    <text x="30" y="365" font-size="10" fill="#f87171">• STR-02: Unanchored floating window with 4-side margin gaps</text>
    <text x="30" y="380" font-size="10" fill="#f87171">• VIS-03: Sparkle icon decoration on standard control</text>
  </g>

  <!-- RIGHT: AFTER (Sloppy Transformed Craft) -->
  <g transform="translate(515, 85)">
    <!-- Container -->
    <rect width="455" height="400" rx="12" fill="#0b0f19" stroke="#10b981" stroke-width="1.5" />

    <!-- Status Badge -->
    <rect x="20" y="16" width="160" height="26" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="30" y="33" font-size="11" font-weight="700" fill="#34d399">AFTER: GRADE A+ (0/100)</text>

    <!-- Restrained Headline -->
    <text x="20" y="75" font-size="22" font-weight="700" fill="#f1f5f9">Pipeline Telemetry</text>
    <text x="20" y="98" font-size="12" fill="#94a3b8">Real-time latency and query distributions across nodes.</text>

    <!-- Grounded Stage (Bleeding off bottom and sides) -->
    <g transform="translate(20, 115)">
      <!-- Surface 1: Window Chrome -->
      <rect width="415" height="180" rx="8" fill="#131b2e" stroke="#1e293b" stroke-width="1" />
      <rect width="415" height="30" rx="8 8 0 0" fill="#1e293b" />
      
      <!-- Chrome Dots -->
      <circle cx="16" cy="15" r="4" fill="#334155" />
      <circle cx="28" cy="15" r="4" fill="#334155" />
      <circle cx="40" cy="15" r="4" fill="#334155" />
      <text x="60" y="19" font-size="10" font-family="monospace" fill="#94a3b8">us-east-1 // trace-collector</text>

      <!-- Surface 2: Elevated Metrics -->
      <rect x="15" y="45" width="120" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="25" y="65" font-size="10" font-weight="600" fill="#64748b">P99 LATENCY</text>
      <text x="25" y="92" font-size="20" font-weight="700" fill="#f8fafc">14.2ms</text>

      <rect x="145" y="45" width="120" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="155" y="65" font-size="10" font-weight="600" fill="#64748b">THROUGHPUT</text>
      <text x="155" y="92" font-size="20" font-weight="700" fill="#f8fafc">4,812/s</text>

      <rect x="275" y="45" width="125" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="285" y="65" font-size="10" font-weight="600" fill="#64748b">ERROR RATE</text>
      <text x="285" y="92" font-size="20" font-weight="700" fill="#10b981">0.002%</text>

      <!-- Word Budget Geometry Placeholders (<Bar />) -->
      <rect x="15" y="125" width="220" height="8" rx="4" fill="#1e293b" />
      <rect x="15" y="142" width="140" height="8" rx="4" fill="#1e293b" />

      <!-- Authentic Control (No Sparkles, 4.8:1 Contrast) -->
      <rect x="300" y="125" width="100" height="30" rx="6" fill="#f8fafc" />
      <text x="322" y="144" font-size="11" font-weight="600" fill="#090d16">View Logs</text>
    </g>

    <!-- Remediation Certifications -->
    <rect x="20" y="315" width="415" height="70" rx="8" fill="#064e3b" stroke="#059669" />
    <text x="30" y="333" font-size="11" font-weight="700" fill="#a7f3d0">Certified Slop-Free (Automated Remediation):</text>
    <text x="30" y="350" font-size="10" fill="#6ee7b7">• Surface depth: Grounded 3-step elevation hierarchy</text>
    <text x="30" y="365" font-size="10" fill="#6ee7b7">• Word budget: Restrained 5 real strings + geometric Bar fillers</text>
    <text x="30" y="380" font-size="10" fill="#6ee7b7">• WCAG AA: Monochromatic contrast verified at 4.8:1</text>
  </g>
</svg>
