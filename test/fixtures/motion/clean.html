<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion interaction fixture: clean</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #09090b; color: #f4f4f5; font: 15px/1.5 system-ui, sans-serif; }
    header { display: flex; gap: 8px; align-items: center; padding: 16px 20px; border-bottom: 1px solid #27272a; }
    header strong { margin-right: 12px; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #3f3f46; background: #18181b; color: #f4f4f5; }
    button:hover { background: #27272a; }
    button:focus-visible { outline: 2px solid #a1a1aa; outline-offset: 2px; }
    main { padding: 28px 20px; display: grid; gap: 20px; }
    #panel {
      position: absolute; top: 64px; right: 20px; width: 260px; padding: 16px;
      border: 1px solid #3f3f46; border-radius: 8px; background: #18181b;
      opacity: 0; transform: translateY(-4px) scale(0.97); transform-origin: top right;
      transition: opacity 150ms ease-out, transform 150ms ease-out;
      visibility: hidden;
    }
    #panel[data-open] { opacity: 1; transform: none; visibility: visible; }
    #error { color: #fca5a5; min-height: 22px; opacity: 0; transition: opacity 120ms ease-out; }
    #error[data-open] { opacity: 1; }
    form { display: grid; gap: 10px; max-width: 320px; }
    label { font-size: 13px; color: #a1a1aa; }
    input { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #3f3f46; background: #0c0c0e; color: #f4f4f5; }
  </style>
</head>
<body>
  <header id="anchor">
    <strong>Ledger</strong>
    <button type="button" id="open" aria-expanded="false" aria-controls="panel">Filters</button>
    <button type="button">Export</button>
  </header>

  <main>
    <div id="panel" role="dialog" aria-label="Filters">
      <p>Status: open</p>
      <button type="button" id="close">Close</button>
    </div>

    <form>
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" autocomplete="email">
      <div id="form-anchor"><button type="button" id="submit">Save changes</button></div>
      <p id="error" role="status"></p>
    </form>
  </main>

  <script>
    const panel = document.getElementById('panel');
    const open = document.getElementById('open');
    const close = document.getElementById('close');
    const error = document.getElementById('error');
    open.addEventListener('click', () => {
      panel.setAttribute('data-open', '');
      open.setAttribute('aria-expanded', 'true');
    });
    close.addEventListener('click', () => {
      panel.removeAttribute('data-open');
      open.setAttribute('aria-expanded', 'false');
      open.focus();
    });
    document.getElementById('submit').addEventListener('click', () => {
      error.textContent = 'Enter a work email before saving.';
      error.setAttribute('data-open', '');
    });
  </script>
</body>
</html>
