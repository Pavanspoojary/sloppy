<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion interaction fixture: broken</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #09090b; color: #f4f4f5; font: 15px/1.5 system-ui, sans-serif; }
    header { display: flex; gap: 8px; align-items: center; padding: 16px 20px; border-bottom: 1px solid #27272a; }
    #banner { display: none; padding: 8px 20px; background: #27272a; }
    #banner:not([hidden]) { display: block; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #3f3f46; background: #18181b; color: #f4f4f5; }
    main { padding: 28px 20px; display: grid; gap: 20px; }
    #panel {
      position: absolute; top: 64px; right: 20px; width: 260px; padding: 16px;
      border: 1px solid #3f3f46; border-radius: 8px; background: #18181b;
      opacity: 0; visibility: hidden; transform: translateY(-4px) scale(0.97);
      transition: opacity 150ms ease-out, transform 150ms ease-out;
    }
    #panel[data-open] { opacity: 1; visibility: visible; transform: none; }
    #slow-panel {
      position: absolute; top: 220px; left: 20px; width: 260px; padding: 16px;
      border: 1px solid #3f3f46; border-radius: 8px; background: #18181b;
      opacity: 0; visibility: hidden;
      transition: opacity 1500ms ease-out;
    }
    #slow-panel[data-open] { opacity: 1; visibility: visible; }
  </style>
</head>
<body>
  <div id="banner" hidden>Layout notice inserted after the panel lands</div>
  <header id="anchor">
    <strong>Ledger</strong>
    <button type="button" id="open">Filters</button>
  </header>

  <main>
    <div id="panel" role="dialog" aria-label="Filters">
      <p>Status: open</p>
    </div>
    <div id="slow-panel" role="dialog" aria-label="Slow panel">
      <p>Still moving</p>
      <button type="button" id="slow-close">Close</button>
    </div>
    <button type="button" id="slow">Open slow panel</button>
  </main>

  <script>
    const panel = document.getElementById('panel');
    document.getElementById('open').addEventListener('click', () => {
      panel.setAttribute('data-open', '');
      setTimeout(() => { document.getElementById('banner').hidden = false; }, 100);
      setTimeout(() => { panel.style.marginTop = '8px'; }, 700);
    });

    const slow = document.getElementById('slow-panel');
    document.getElementById('slow').addEventListener('click', () => {
      slow.setAttribute('data-open', '');
    });
    document.getElementById('slow-close').addEventListener('click', () => {
      slow.style.transition = 'opacity 1500ms ease-out';
      slow.style.opacity = '0.5';
    });
  </script>
</body>
</html>
