name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run without publishing to npm'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @sloppy-ai Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Monorepo Packages
        run: npm run build

      - name: Static Typecheck
        run: npm run typecheck

      - name: Verify Craft Rubric & Zero-Tolerance Anti-Slop Standard
        run: npm test

      - name: Publish @sloppy-ai Packages to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          FLAGS="--access public"
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
            echo "Performing dry-run release..."
          fi

          PACKAGES=(
            "@sloppy-ai/core"
            "@sloppy-ai/verify"
            "@sloppy-ai/kit"
            "@sloppy-ai/mcp"
            "@sloppy-ai/cli"
          )

          for PKG in "${PACKAGES[@]}"; do
            echo "Publishing $PKG..."
            npm publish --workspace="$PKG" $FLAGS
          done
